# Telescope: when a draft release made by telescope-build.yml is published on GitHub,
# upload its APK to Cloudflare R2 (dl.hyv.moe) and point android/latest.json at it.
name: Telescope publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish"
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'android-v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BUCKET: telescope-dl
      BASE_URL: https://dl.hyv.moe
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          ls -la out

      - name: Verify and build latest.json
        run: |
          cd out
          apk=$(ls *.apk); sha256sum -c "$apk.sha256"
          sha=$(cut -d' ' -f1 "$apk.sha256")
          vc=$(echo "$apk" | sed -E 's/.*-([0-9]+)\.apk$/\1/')
          name=$(echo "$apk" | sed -E 's/^telescope-(.*)-[0-9]+\.apk$/\1/')
          notes=$(grep -v '^versionCode:' ../body.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          jq -n --arg v "$name" --argjson vc "$vc" --arg url "$BASE_URL/android/$apk" --arg sha "$sha" \
                --argjson size "$(stat -c %s "$apk")" --arg notes "$notes" --arg date "$(date -u +%FT%TZ)" \
                '{version:$v, version_code:$vc, file_url:$url, sha256:$sha, size:$size, changelog:$notes, date:$date}' > latest.json
          cat latest.json
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Upload to R2
        run: |
          w="npx -y wrangler@4 r2 object put"
          $w "$BUCKET/android/$APK" --file "out/$APK" --remote \
             --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable"
          $w "$BUCKET/android/Telescope.apk" --file "out/$APK" --remote \
             --content-type application/vnd.android.package-archive --cache-control "public, max-age=300" \
             --content-disposition 'attachment; filename="Telescope.apk"'
          # metadata last, so clients never see a version whose APK isn't there yet
          $w "$BUCKET/android/latest.json" --file out/latest.json --remote \
             --content-type application/json --cache-control "no-cache"

      - name: Check
        run: |
          sleep 5
          curl -fsS "$BASE_URL/android/latest.json"
          curl -fsSI "$BASE_URL/android/$APK" | grep -iE '^(HTTP|content-length)'
