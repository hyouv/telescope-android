# Telescope: build a signed release APK. Optionally creates a draft GitHub release;
# publishing that draft (by hand) triggers telescope-publish.yml.
name: Telescope build

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Telescope revision on top of the upstream version (0-9)"
        default: "0"
      release:
        description: "Create a draft release"
        type: boolean
        default: false
      notes:
        description: "Release notes"
        default: ""

concurrency:
  group: telescope-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Native build cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/.cxx
          key: cxx-${{ hashFiles('TMessagesProj/jni/**') }}
          restore-keys: cxx-

      - name: Secrets
        env:
          PROPS: ${{ secrets.TELESCOPE_PROPERTIES }}
          KEYSTORE: ${{ secrets.TELESCOPE_KEYSTORE_B64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          d="$RUNNER_TEMP/secrets"; mkdir -p "$d"
          printf '%s\n' "$PROPS" > "$d/telescope.properties"
          printf '%s' "$KEYSTORE" | base64 -d > "$d/telescope-release.jks"
          if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > "$d/google-services.json"; fi
          echo "TELESCOPE_SECRETS=$d/telescope.properties" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -PTELESCOPE_REVISION=${{ inputs.revision }} --no-daemon

      - name: Collect
        id: apk
        run: |
          name=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          code=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          rev=${{ inputs.revision }}
          vc=$(( (code * 10 + 9) * 10 + rev ))
          tag="android-v${name}-${code}"; [ "$rev" != 0 ] && tag="${tag}.${rev}"
          file="telescope-${name}-${vc}.apk"
          mkdir out && cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "out/$file"
          (cd out && sha256sum "$file" > "$file.sha256")
          aapt=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          "$aapt" dump badging "out/$file" | head -1
          "$aapt" dump badging "out/$file" | grep -q "versionCode='$vc'" || { echo "versionCode mismatch"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "vc=$vc" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: out/*
          retention-days: 14

      - name: Draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n\nversionCode: %s\n' "${NOTES:-Telescope ${{ steps.apk.outputs.name }}}" "${{ steps.apk.outputs.vc }}" > notes.md
          gh release create "${{ steps.apk.outputs.tag }}" out/* --draft \
            --target "$GITHUB_SHA" --title "Telescope Android ${{ steps.apk.outputs.name }} (${{ steps.apk.outputs.vc }})" \
            --notes-file notes.md
