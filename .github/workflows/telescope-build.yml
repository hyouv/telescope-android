# Telescope: build a signed release APK. Optionally creates a draft GitHub release;
# publishing that draft (by hand) triggers telescope-publish.yml.
name: Telescope build

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Telescope revision on top of the upstream version (0-9)"
        default: "0"
      release:
        description: "Create a draft release"
        type: boolean
        default: false
      notes:
        description: "Release notes"
        default: ""

concurrency:
  group: telescope-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/jvm/*-8-* || true
          for d in "$ANDROID_HOME"/ndk/*; do [ "$(basename "$d")" = 27.2.12479018 ] || sudo rm -rf "$d"; done
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Set up ccache
        run: |
          sudo apt-get install -y -qq ccache > /dev/null
          ccache --set-config=cache_dir=$HOME/.ccache --set-config=max_size=6G --set-config=compression=true
          ccache -z
          # picked up by CMake as the default compiler launcher
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Secrets
        env:
          PROPS: ${{ secrets.TELESCOPE_PROPERTIES }}
          KEYSTORE: ${{ secrets.TELESCOPE_KEYSTORE_B64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          d="$RUNNER_TEMP/secrets"; mkdir -p "$d"
          printf '%s\n' "$PROPS" > "$d/telescope.properties"
          printf '%s' "$KEYSTORE" | base64 -d > "$d/telescope-release.jks"
          if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > "$d/google-services.json"; fi
          echo "TELESCOPE_SECRETS=$d/telescope.properties" >> "$GITHUB_ENV"

      # runners have ~8GB RAM; extra swap keeps R8 from taking the whole runner down
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -h

      # native code first, so the ccache gets saved even if the Java/R8 part fails later
      - name: Build native
        run: ./gradlew :TMessagesProj:externalNativeBuildRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Native stats
        if: always()
        run: |
          ccache -s || true
          df -h /

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}

      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -PTELESCOPE_REVISION=${{ inputs.revision }} --no-daemon -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=false

      - name: Collect
        id: apk
        run: |
          name=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          code=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          rev=${{ inputs.revision }}
          vc=$(( (code * 10 + 9) * 10 + rev ))
          tag="android-v${name}-${code}"; [ "$rev" != 0 ] && tag="${tag}.${rev}"
          file="telescope-${name}-${vc}.apk"
          mkdir out && cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk "out/$file"
          (cd out && sha256sum "$file" > "$file.sha256")
          aapt=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          "$aapt" dump badging "out/$file" | head -1
          "$aapt" dump badging "out/$file" | grep -q "versionCode='$vc'" || { echo "versionCode mismatch"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "vc=$vc" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: out/*
          retention-days: 14

      - name: Draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n\nversionCode: %s\n' "${NOTES:-Telescope ${{ steps.apk.outputs.name }}}" "${{ steps.apk.outputs.vc }}" > notes.md
          gh release create "${{ steps.apk.outputs.tag }}" out/* --draft \
            --target "$GITHUB_SHA" --title "Telescope Android ${{ steps.apk.outputs.name }} (${{ steps.apk.outputs.vc }})" \
            --notes-file notes.md
