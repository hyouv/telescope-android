# Telescope: sanity check that the CI secrets are present and the Cloudflare token can write to R2.
name: Telescope check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROPS: ${{ secrets.TELESCOPE_PROPERTIES }}
      KEYSTORE: ${{ secrets.TELESCOPE_KEYSTORE_B64 }}
    steps:
      - name: Present
        run: |
          fail=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROPS KEYSTORE; do
            val="${!v}"
            if [ -z "$val" ]; then echo "::error::$v is empty"; fail=1; else echo "$v: ${#val} chars"; fi
          done
          exit $fail
      - name: R2 write
        run: |
          date -u +%FT%TZ > ping.txt
          npx -y wrangler@4 r2 object put telescope-dl/ci-ping.txt --file ping.txt --remote --cache-control no-cache
          sleep 3; curl -fsS https://dl.hyv.moe/ci-ping.txt
